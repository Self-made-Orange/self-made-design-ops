name: deploy pages

# docs/ 를 GitHub Pages 로 배포합니다.
#
# 사전 조건 — 저장소에서 Pages 를 한 번 켜야 합니다:
#   Settings → Pages → Build and deployment → Source: **GitHub Actions**
# `actions/configure-pages` 의 `enablement: true` 로 워크플로가 직접 켜는 것을
# 시도했으나 실패했습니다 (run 32322753388, 2026-08-20):
#   Create Pages site failed. Error: Resource not accessible by integration
# GITHUB_TOKEN 에 pages: write 를 줘도 **사이트 생성** 권한은 오지 않습니다.
# 그래서 enablement 를 쓰지 않고, 소유자가 켠 뒤부터 이 워크플로가 배포합니다.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'design-systems/data/**'
      - 'design-systems/patterns/**'
      - 'design-systems/systems/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지는 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 커밋된 생성물이 낡았어도 배포본은 항상 최신 코퍼스 기준이 되게 합니다.
      # (커밋본과 어긋나는지는 site.yml 이 PR 에서 따로 잡습니다.)
      - name: 데이터 재생성
        run: |
          node design-systems/i18n.mjs --check
          node design-systems/build-data.mjs
          node site/build.mjs

      - id: configure
        uses: actions/configure-pages@v5

      # Pages 가 아직 안 켜져 있으면 위 스텝이 Not Found 로 죽습니다.
      # 로그를 파고들지 않아도 되게 무엇을 눌러야 하는지 요약에 적어 둡니다.
      - name: 실패 원인 안내
        if: failure() && steps.configure.outcome == 'failure'
        run: |
          {
            echo '### Pages 가 아직 켜져 있지 않습니다'
            echo ''
            echo '저장소 **Settings → Pages → Build and deployment → Source** 를'
            echo '**GitHub Actions** 로 바꾸면 이 워크플로가 바로 배포합니다.'
            echo ''
            echo '워크플로가 직접 켜는 것(`configure-pages` 의 `enablement: true`)은'
            echo '`GITHUB_TOKEN` 권한 밖이라 쓰지 않습니다 — `pages: write` 로도'
            echo '사이트 *생성*은 되지 않습니다.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
